<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>reclink</title>
    <style>
      :root {
        --blue: #4a7fe8;
        --blue-deep: #3b82f6;
        --blue-bg: #edf3fe;
        --text: #3c4043;
        --text-2: #80868b;
        --border: #e8eaed;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #f8f9fa;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px 22px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(60, 64, 67, 0.1);
        width: 100%;
        max-width: 430px;
      }
      .mark {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        margin: 0 auto 12px;
        background: var(--blue);
        position: relative;
      }
      .mark::after {
        content: '';
        position: absolute;
        width: 10px;
        height: 10px;
        left: 10px;
        top: 10px;
        border-radius: 50%;
        background: #fff;
      }
      h1 { font-size: 15px; margin-bottom: 6px; color: #202124; }
      p { font-size: 13px; color: var(--text-2); line-height: 1.6; }
      button {
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        transition: background 0.15s;
      }
      button:hover { background: var(--blue-deep); }
      .primary {
        display: block;
        width: 100%;
        margin-top: 14px;
        padding: 9px;
        background: var(--blue);
        color: #fff;
        font-size: 13.5px;
      }
      .spinner {
        width: 22px;
        height: 22px;
        margin: 10px auto 2px;
        border-radius: 50%;
        border: 3px solid var(--blue-bg);
        border-top-color: var(--blue);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .guide {
        margin-top: 14px;
        background: #f8f9fa;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        text-align: left;
        font-size: 12.5px;
        color: var(--text-2);
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" id="mark"></div>

      <section class="status status-preparing" id="prepare">
        <h1 id="prepare-title"></h1>
        <p id="prepare-hint"></p>
        <div class="spinner" id="spinner"></div>
      </section>

      <section class="status status-error" id="error-view" hidden>
        <h1 id="error-title"></h1>
        <p id="error-detail"></p>
        <div class="guide" id="error-guide" hidden></div>
        <button class="primary" id="retry"></button>
      </section>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
